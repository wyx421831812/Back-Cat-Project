<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BongoCat Live2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        /* 根元素必须显式透明，否则 Chromium 会渲染白色页面背景 */
        html { background: transparent; }
        body { background: transparent; }
        #app {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }
        /* 背景层 (在 canvas 之下) - 与官方 BongoCat 一致用 HTML <img> 加载，
           浏览器能正确处理 PNG 的透明通道 (PIXI sprite 会把 (255,255,255,0)
           的透明像素按预乘alpha渲染成白色) */
        #bg-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            display: none;
        }
        /* pixi.js 使用 #app canvas 作为渲染目标 */
        /* 按键图层 (在 canvas 之上) */
        #key-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }
        #key-layer img {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: fill;
        }
    </style>

    <!-- 所有 JS 库由 C++ 在 loadCombinedHtml() 中内联注入 (Qt WebView 不支持 qrc:/ 协议) -->
    /*__INLINE_SCRIPTS__*/
</head>
<body>
    <img id="bg-layer" alt="" />
    <canvas id="app"></canvas>
    <div id="key-layer"></div>
    <script>
    // =============================================
    // === BongoCat Live2D 渲染引擎（Qt 集成版）===
    // 兼容 BongoCat 三种模型模式: standard / keyboard / gamepad
    // =============================================

    let app = null;
    let model = null;
    let currentModelPath = null;
    let currentMode = 'standard'; // standard | keyboard | gamepad
    let isInitialized = false;
    let coreReady = false;

    // === L-105: 可配置的自动释放延迟 (毫秒) ===
    let autoReleaseDelay = 100;

    // === L-102/L-103: 手部/鼠标按键状态追踪 ===
    // leftHandDown/rightHandDown 每帧由 pressedKeyTimers + 鼠标状态计算得出,
    // 对应官方参数 CatParamLeftHandDown/CatParamRightHandDown。
    let leftHandDown = false;
    let rightHandDown = false;
    // 按下中的键: 规范键名 -> { raw, timer }
    // 对齐官方 Windows 行为 (useDevice.ts handleAutoRelease):
    //   每次 keydown 立即按下并挂 autoReleaseDelay 兜底定时器, 即使 keyup
    //   完全丢失 (Win 键 / Ctrl+Alt+Del / UAC / 全屏游戏独占切换) 到点也强制抬手;
    //   重复 keydown 重置定时器 (长按期间手保持按压)。
    const pressedKeyTimers = {};
    // 鼠标左右键独立状态 (仅 standard 模型有 ParamMouseLeftDown/RightDown 参数)
    let mouseLeftDown = false;
    let mouseRightDown = false;
    // 模型是否自带逐键键帽气泡 ArtMesh (星见雅骨架等改模):
    // 探测到任意逐键参数时, HTML 层不再叠加键帽图, 避免与模型内置气泡重影
    let modelHasBuiltinKeyArt = false;
    // cdi3 参数元数据: C++ 从模型同目录 *.cdi3.json 读取并下发,
    // 数据驱动地建立"按键规范名 -> 模型参数 Id"映射, 新模型零代码改动
    let modelParamMeta = [];
    let modelKeyToParam = {};   // 'KeyD' / 'Digit1' / 'Control' ... -> 参数 Id
    let modelKeyParamIds = [];  // 当前模型的全部逐键参数 Id (每帧把未激活的归 min)

    // === L-101: 鼠标位置 (屏幕归一化坐标 0~1, 由 C++ 端从 [-1,1] 转换) ===
    // 参考 BongoCat useModel.ts handleMouseMove:
    //   xRatio/yRatio ∈ [0,1], 然后按参数 min/max 范围映射
    let targetMouseXRatio = 0.5;
    let targetMouseYRatio = 0.5;
    let currentMouseXRatio = 0.5;
    let currentMouseYRatio = 0.5;
    // 内置逐键艺术模型 (星见雅骨架等) 专用: 键盘激活时设备侧 (鼠标垫发光/左手
    // 位置) 的等效坐标, 与驱动头眼的 currentMouse*Ratio 分离, 可单独归中
    let handArtXRatio = 0.5;
    let handArtYRatio = 0.5;
    // 模型是否提供独立的鼠标按下参数。YuHen 等改模骨架实测: LHD 与 MLD 同时为 1
    // 时手部形变会叠加成"抬手悬空"的怪姿态, 故鼠标按下只能走 MLD;
    // 仅当模型缺少 MLD/MRD 时才回退用 LHD/RHD 表达按压 (老式模型兼容)
    let modelHasMouseLParam = true;
    let modelHasMouseRParam = true;

    // === L-104: 手柄 (摇杆参数 + 按键参数) ===
    let stickLX = 0, stickLY = 0, stickRX = 0, stickRY = 0;
    let stickShowLeft = false, stickShowRight = false;
    let stickLeftDown = false, stickRightDown = false;

    // === L-104: 待机动画 - 自动眨眼 ===
    // pixi-live2d-display 内置眨眼有时不可靠，这里手动控制以保证稳定性
    let blinkNextTime = 0;       // 下一次眨眼的时间戳
    let blinkState = 'open';     // 'open' | 'closing' | 'closed' | 'opening'
    let blinkStateTime = 0;      // 当前状态进入时间
    let eyeOpenValue = 1.0;      // 当前眼睛张开度 0~1
    let lastInteractionTime = 0; // 最后一次交互时间，用于判断是否进入待机
    const BLINK_INTERVAL_MIN = 2200;
    const BLINK_INTERVAL_MAX = 5500;

    // === 模型参数存在性缓存 (避免每帧 try/catch) ===
    const paramExists = {};
    // 注意: pixi-live2d-display 0.4 的参数读写 API (getParameterValueById /
    // setParameterValueById / getParameterIndex / getParameterCount / min/max)
    // 实际挂在 model.internalModel.coreModel (Cubism4CoreModel) 上:
    //   Live2DModel → internalModel (Cubism4InternalModel) → coreModel (Cubism4CoreModel)
    // internalModel 本身只有 coreModel / motionManager / eyeBlink 等，没有参数方法，
    // 直接调用会抛 TypeError 被吞掉，导致所有参数动画(眼睛跟随/手部按下/眨眼/呼吸)失效。
    function coreModel() {
        return (model && model.internalModel) ? model.internalModel.coreModel : null;
    }
    function hasParam(id) {
        if (id in paramExists) return paramExists[id];
        var im = coreModel();
        if (!im) { paramExists[id] = false; return false; }
        try {
            // 注意: pixi-live2d-display 的 getParameterIndex 对不存在的参数
            // 返回"虚拟索引"(>= 真实参数个数)，永远不会返回负数，
            // 因此必须与真实参数个数比较才是可靠的存在性判断
            var idx = im.getParameterIndex(id);
            if (idx >= 0 && idx < im.getParameterCount()) {
                paramExists[id] = true;
                return true;
            }
        } catch (e) {}
        paramExists[id] = false;
        return false;
    }
    function safeSetParam(id, value) {
        if (!hasParam(id)) return;
        var im = coreModel();
        if (!im) return;
        try { im.setParameterValueById(id, value); } catch (e) { console.warn('[Live2D] setParam failed:', id, e); }
    }
    // 获取参数范围 [min, max]，不存在或无范围返回 null
    function getParamRange(id) {
        var im = coreModel();
        if (!im) return null;
        try {
            var idx = im.getParameterIndex(id);
            if (idx < 0 || idx >= im.getParameterCount()) return null;
            var min = im.getParameterMinimumValue(idx);
            var max = im.getParameterMaximumValue(idx);
            if (typeof min === 'number' && typeof max === 'number') {
                return { min: min, max: max };
            }
        } catch (e) {}
        return null;
    }

    // getParameterRange 与 getParamRange 是同一函数的两个别名（供 Live2DAPI 暴露）
    function getParameterRange(id) {
        return getParamRange(id);
    }

    // ==================================================
    // === 完整键盘支持 (对应 BongoCat keyboard.ts) ===
    // ==================================================
    // 左右手按物理键位划分（左半区→左手，右半区→右手），
    // 同时包含基础名和 Left/Right 变体以兼容 C++ vkToKeyName 输出。
    const LEFT_KEYS = new Set([
        // 字母左半区
        'KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT',
        'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG',
        'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB',
        // 主键盘数字 1-5
        'Digit1', 'Num1', 'Digit2', 'Num2', 'Digit3', 'Num3',
        'Digit4', 'Num4', 'Digit5', 'Num5', 'Digit6', 'Num6',
        // 功能键左半
        'Escape', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6',
        // 符号 / 控制
        'Backquote', 'BackQuote', 'Minus', 'Equal', 'Backspace',
        'Tab', 'CapsLock',
        'BracketLeft', 'BracketRight', 'Backslash',
        'Semicolon', 'Quote', 'Enter', 'Return', 'Comma',
        // 修饰键 (基础名 + 左变体)
        'Shift', 'ShiftLeft',
        'Control', 'ControlLeft',
        'Alt', 'AltLeft',
        'Meta', 'MetaLeft',
        'Fn', 'Delete', 'Space', 'ContextMenu'
    ]);

    // 右键盘区
    const RIGHT_KEYS = new Set([
        // 字母右半区
        'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP',
        'KeyH', 'KeyJ', 'KeyK', 'KeyL',
        'KeyN', 'KeyM',
        // 主键盘数字 6-0 (6 同时在左手集合，归哪边看物理位置；这里右手集合也包含 7-0)
        'Digit7', 'Num7', 'Digit8', 'Num8', 'Digit9', 'Num9', 'Digit0', 'Num0',
        // 功能键右半
        'F7', 'F8', 'F9', 'F10', 'F11', 'F12',
        // 符号
        'Period', 'Slash',
        // 方向键 (DOM 名 + 简短名 + 资源文件别名)
        'ArrowUp', 'Up', 'ArrowDown', 'Down',
        'ArrowLeft', 'Left', 'ArrowRight', 'Right',
        'UpArrow', 'DownArrow', 'LeftArrow', 'RightArrow',
        // 修饰键右变体
        'ShiftRight', 'ControlRight', 'AltRight', 'MetaRight', 'AltGr'
    ]);

    // 游戏手柄按键映射 (对应 BongoCat gamepad model resources/)
    // 左手按键: A(0)/X(2)/LB(4)/LT(6)/D-Left(14)/D-Up(12)/D-Down(13)
    const GAMEPAD_LEFT_BUTTONS = new Set([0, 2, 4, 6, 12, 13, 14]);
    // 右手按键: B(1)/Y(3)/RB(5)/RT(7)/D-Right(15)/Start(9)
    const GAMEPAD_RIGHT_BUTTONS = new Set([1, 3, 5, 7, 8, 9, 15]);

    // 判断按键归属哪只手 (与官方 BongoCat main/index.vue watch(pressedKeys) 等价):
    // 1) 优先用模型资源注册表 _keyHands (C++ 按 resources/left-keys|right-keys 目录下发),
    //    不同模型键集合不同, 以模型自带资源为权威来源 -> 新模型无需逐个人肉测试
    // 2) 注册表查不到时回退物理键位分区 (LEFT_KEYS/RIGHT_KEYS)
    // 返回 'left' | 'right' | null
    function classifyKey(rawKey) {
        var hands = (window.Live2DAPI && window.Live2DAPI._keyHands) || {};
        var nk = normalizeKey(rawKey);
        // normalizeKey 的逆映射: 内部规范名 -> 模型资源文件名 (C++ 按资源名注册)
        var reverseMap = {
            'Digit0': 'Num0', 'Digit1': 'Num1', 'Digit2': 'Num2', 'Digit3': 'Num3',
            'Digit4': 'Num4', 'Digit5': 'Num5', 'Digit6': 'Num6', 'Digit7': 'Num7',
            'Digit8': 'Num8', 'Digit9': 'Num9',
            'Enter': 'Return'
        };
        var candidates = [rawKey, nk, reverseMap[nk], reverseMap[rawKey],
                          arrowAlias(rawKey), arrowAlias(nk)];
        for (var i = 0; i < candidates.length; i++) {
            var c = candidates[i];
            if (c && hands[c] === 'left') return 'left';
            if (c && hands[c] === 'right') return 'right';
        }
        if (LEFT_KEYS.has(rawKey) || LEFT_KEYS.has(nk)) return 'left';
        if (RIGHT_KEYS.has(rawKey) || RIGHT_KEYS.has(nk)) return 'right';
        return null;
    }

    // ==================================================
    // === 逐键参数映射 (数据驱动, 自动适配任意社区改模) ===
    // 官方标准模型只有 CatParamLeftHandDown (手只做"按下"动作, 不移动位置);
    // 社区改模模型额外提供逐键参数: 参数=max 时手滑到对应键帽并弹出内置气泡,
    // 全部=min 时手回到待机位。各改模的参数 Id 千差万别
    // (Q1/D1/F0... 旧骨架, Param85..Param107 新骨架, 以及未来任意命名),
    // 但其 cdi3.json 显示名统一就是键帽名 (D / d / 1 / Ctrl / 空格 ...)。
    // C++ 加载模型时读取同目录 *.cdi3.json, 经 setModelParamMeta 下发,
    // rebuildKeyParamMap() 按显示名自动识别 —— 新增模型无需再改代码。
    // 仅当模型缺少 cdi3 元数据时, 才回退到下面的历史命名兜底表。
    const FALLBACK_KEY_TO_PARAM = {
        'KeyQ': ['Q1', 'Param107'], 'KeyW': ['W1', 'Param106'],
        'KeyE': ['E1', 'Param105'], 'KeyR': ['R1', 'Param104'], 'KeyT': ['T1', 'Param103'],
        'KeyA': ['A1', 'Param102'], 'KeyS': ['S1', 'Param101'],
        'KeyD': ['D1', 'Param100'], 'KeyF': ['F1', 'Param99'], 'KeyG': ['G1', 'Param98'],
        'KeyZ': ['Z1', 'Param96'], 'KeyX': ['X1', 'Param95'],
        'KeyC': ['C1', 'Param94'], 'KeyV': ['V1', 'Param93'], 'KeyB': ['B1', 'Param92'],
        'Digit1': ['F0'], 'Digit3': ['F2'], 'Digit4': ['F3'],
        'Digit5': ['F4'], 'Digit6': ['F5'],
        'Enter': ['Enter1', 'Param97'],
        'Control': ['Ctrl', 'Param87'], 'Shift': ['Shift', 'Param88'],
        'Alt': ['Alt', 'Param86'],
        'Space': ['Space', 'Param85']
    };

    // 特殊键显示名 -> 键盘规范名 (cdi3 Name 可能是中英文)
    const SPECIAL_KEY_LABELS = {
        'space': 'Space', 'spacebar': 'Space', '空格': 'Space',
        'ctrl': 'Control', 'control': 'Control', '控制': 'Control', '控制键': 'Control',
        'alt': 'Alt', 'option': 'Alt', '换挡': 'Alt',
        'shift': 'Shift', '上档': 'Shift',
        'enter': 'Enter', 'return': 'Enter', '回车': 'Enter'
    };

    // 标签文本归一化: 去空白/零宽字符并转小写
    function normalizeKeyLabelText(raw) {
        return String(raw == null ? '' : raw)
            .replace(/[\s\u200b-\u200f\ufeff]/g, "")
            .toLowerCase();
    }

    // 把 cdi3 参数的显示名 (Name) 或参数 Id 识别为键盘规范名。
    // isId=true 时使用更保守的规则 (Id 只是机器名, 陷阱多):
    //   旧骨架数字行参数是 F0..F5 (名字却是 1..6), 绝不能按字母 F 误判,
    //   故 Id 路径只接受 "字母" 或 "字母+尾号1" (Q1/D1/F1), 拒绝 F0/F2..F5。
    // 非按键装饰参数 (如 "捏脸手出现"/"关闭气泡") 返回 null 自然排除。
    function labelToCanonicalKey(raw, isId) {
        var t = normalizeKeyLabelText(raw);
        if (!t) return null;
        if (/^[a-z]$/.test(t)) return 'Key' + t.toUpperCase();
        if (/^[0-9]$/.test(t)) return 'Digit' + t;
        if (SPECIAL_KEY_LABELS[t]) return SPECIAL_KEY_LABELS[t];
        if (isId) {
            if (/^[a-egh-z]1?$/.test(t)) return 'Key' + t.charAt(0).toUpperCase();
            if (t === 'f1') return 'KeyF';
            if (/^(enter|return|ctrl|control|shift|alt|space)1?$/.test(t)) {
                return SPECIAL_KEY_LABELS[t.replace(/1$/, '')] || null;
            }
        }
        return null;
    }

    // 根据 cdi3 元数据 (或兜底表) 重建当前模型的按键->参数映射。
    // 在每次模型加载完成 (resetParameters) 时调用。
    function rebuildKeyParamMap() {
        modelKeyToParam = {};
        modelKeyParamIds = [];
        var usedIds = {};
        function put(key, id) {
            if (!key || !id || usedIds[id]) return;
            if (!modelKeyToParam[key]) modelKeyToParam[key] = id;
            usedIds[id] = true;
            modelKeyParamIds.push(id);
        }
        if (modelParamMeta && modelParamMeta.length) {
            // 第一轮: 按 cdi3 显示名识别 (最可靠, 覆盖 D/d/1/空格/Ctrl...)
            modelParamMeta.forEach(function (p) {
                put(labelToCanonicalKey(p.name, false), p.id);
            });
            // 第二轮: 显示名缺失时用参数 Id 保守兜底, 且不覆盖已有映射
            modelParamMeta.forEach(function (p) {
                var key = labelToCanonicalKey(p.id, true);
                if (key && !modelKeyToParam[key]) put(key, p.id);
            });
        } else if (model) {
            // 无 cdi3 元数据: 用历史命名兜底, 只保留模型实际存在的参数
            for (var fk in FALLBACK_KEY_TO_PARAM) {
                var cands = FALLBACK_KEY_TO_PARAM[fk];
                for (var ci = 0; ci < cands.length; ci++) {
                    if (hasParam(cands[ci])) { put(fk, cands[ci]); break; }
                }
            }
        }
        modelHasBuiltinKeyArt = modelKeyParamIds.length > 0;
        console.log('[Live2D] key-param mapping rebuilt: ' + modelKeyParamIds.length +
                    ' key params, meta=' + ((modelParamMeta && modelParamMeta.length) || 0));
    }

    // === 初始化入口 (依赖 CDN/local 加载完毕后由 onload 回调触发) ===
    function initLive2dCore() {
        if (coreReady) return;
        coreReady = true;

        // 如果外部调用了 initPixi，等待 PIXI 全局对象就绪
        if (typeof PIXI === 'undefined' || typeof PIXI.Application === 'undefined') {
            setTimeout(initLive2dCore, 50);
            return;
        }

        console.log('[BongoCat Live2D] Core ready, PIXI v' + PIXI.VERSION);
        startBridge();
    }

    // 给 onload 回调暴露全局名
    window.initLive2dCore = initLive2dCore;

    // === 启动初始化：脚本 onload 没触发的情况下兜底 ===
    (function bootCheck() {
        var tryCount = 0;
        var t = setInterval(function() {
            tryCount++;
            if (typeof PIXI !== 'undefined' && typeof PIXI.Application !== 'undefined') {
                clearInterval(t);
                initLive2dCore();
            }
            if (tryCount > 200) {
                clearInterval(t);
                console.error('[BongoCat Live2D] Failed to load pixi.js after 10s');
            }
        }, 50);
    })();

    // =============================================
    // === Pixi.js 初始化 ===
    function initPixi() {
        if (app) return app;
        app = new PIXI.Application({
            view: document.getElementById('app'),
            transparent: true,
            backgroundAlpha: 0,
            resizeTo: window,
            autoStart: true,
            powerPreference: 'high-performance',
            resolution: window.devicePixelRatio || 1,
            antialias: true
        });
        window.addEventListener('resize', function() { if (model) scaleModel(); });
        return app;
    }

    // =============================================
    // === 加载 Live2D 模型 (自动匹配模式) ===
    async function loadModel(modelPath) {
        try {
            initPixi();
            if (model) { model.destroy(); model = null; }

            currentModelPath = modelPath;

            // 从路径识别模式 (standard/keyboard/gamepad)
            var low = modelPath.toLowerCase().replace(/\\/g, '/');
            if (low.indexOf('/gamepad') >= 0) currentMode = 'gamepad';
            else if (low.indexOf('/keyboard') >= 0) currentMode = 'keyboard';
            else currentMode = 'standard';
            console.log('[loadModel] mode=' + currentMode + ' path=' + modelPath);

            var assetPath = modelPath.replace(/\\/g, '/');
            var modelJsonPath = assetPath.endsWith('.model3.json')
                ? assetPath
                : assetPath + '/cat.model3.json';

            console.log('[loadModel] Loading model3.json:', modelJsonPath);

            model = await PIXI.live2d.Live2DModel.from(modelJsonPath, {
                autoInteract: false,
                autoUpdate: true
            });

            scaleModel();
            app.stage.addChild(model);
            resetParameters();

            // 调试: 打印关键参数的存在性和范围信息
            var debugParams = ['CatParamLeftHandDown', 'CatParamRightHandDown', 'ParamMouseLeftDown', 'ParamMouseRightDown', 'ParamMouseX', 'ParamMouseY', 'ParamAngleX', 'ParamAngleY', 'ParamEyeBallX', 'ParamEyeBallY'];
            for (var di = 0; di < debugParams.length; di++) {
                var pid = debugParams[di];
                var exists = hasParam(pid);
                var range = getParamRange(pid);
                var val = 'N/A';
                try { val = model.internalModel.coreModel.getParameterValueById(pid); } catch (e) {}
                console.log('[ModelDebug]', pid, 'exists:', exists, 'range:', range ? ('[' + range.min + ', ' + range.max + ']') : 'null', 'val:', val);
            }

            if (notifyModelLoaded) {
                var modelInfo = {
                    width: model.width || 0,
                    height: model.height || 0,
                    mode: currentMode,
                    motions: getAvailableMotions(),
                    expressions: getAvailableExpressions()
                };
                notifyModelLoaded(modelInfo);
            }
            console.log('Model loaded. mode=' + currentMode);
            return true;
        } catch (error) {
            console.error('Failed to load model:', error);
            notifyError(error.message || String(error));
            return false;
        }
    }

    // 模型水平偏移 (逻辑像素, 正数=右移): 官方模型画布里猫咪略微偏左，
    // 右移一点让猫咪对准桌面/键盘-鼠标的中心。如需微调改这个值即可。
    const MODEL_OFFSET_X = 22;

    function scaleModel() {
        if (!model || !app) return;
        var sw = app.screen.width;
        var sh = app.screen.height;
        // 与官方 BongoCat (src/utils/live2d.ts resizeModel) 完全一致:
        //   scale = min(sx, sy); anchor = 0.5; 模型中心对准窗口中心
        // 关键: PIXI 显示对象的 width/height = 原始尺寸 × 当前 scale。
        // 必须先把 scale 复位为 1 再读取原始尺寸, 否则每次窗口 resize 都会得到
        //   scale_new = scale_fit / scale_old
        // 模型加载完成后 scale_old = scale_fit, 任何一次多余的 resize 事件
        // (如设置窗口重建原生窗口) 都会把 scale 变成 1.0, 导致模型按画布
        // 原始尺寸渲染, 远超窗口大小 (模型异常变大的根因)。
        model.scale.set(1);
        if (model.width <= 0 || model.height <= 0) return;
        var scale = Math.min(sw / model.width, sh / model.height);
        model.scale.set(scale);
        model.anchor.set(0.5);
        model.x = sw / 2 + MODEL_OFFSET_X;
        model.y = sh / 2;
        scaleBackground();
    }

    function scaleBackground() {
        if (!bgSprite || !app) return;
        bgSprite.x = 0;
        bgSprite.y = 0;
        bgSprite.width = app.screen.width;
        bgSprite.height = app.screen.height;
    }

    // =============================================
    // === 参数重置 ===
    function resetParameters() {
        if (!model) return;
        // 重置参数存在性缓存 (换模型后参数集合可能变化)
        Object.keys(paramExists).forEach(function(k) { delete paramExists[k]; });
        // 数据驱动识别逐键参数: 按 C++ 下发的 cdi3 元数据建立键->参数映射,
        // 存在任意逐键参数即视为骨架自带气泡, HTML 层键帽图让位
        rebuildKeyParamMap();
        modelHasMouseLParam = hasParam('ParamMouseLeftDown');
        modelHasMouseRParam = hasParam('ParamMouseRightDown');
        console.log('[Live2D] model builtin key-art bubble:', modelHasBuiltinKeyArt,
                    ', mouseDown params: L=' + modelHasMouseLParam, 'R=' + modelHasMouseRParam);

        // L-101: 鼠标位置回到中心
        targetMouseXRatio = currentMouseXRatio = 0.5;
        targetMouseYRatio = currentMouseYRatio = 0.5;
        handArtXRatio = handArtYRatio = 0.5;

        // L-102/L-103: 手部状态 + 释放所有残留按键与键帽图
        leftHandDown = rightHandDown = false;
        mouseLeftDown = mouseRightDown = false;
        releaseAllKeys();

        // L-104: 手柄状态
        stickLX = stickLY = stickRX = stickRY = 0;
        stickShowLeft = stickShowRight = false;
        stickLeftDown = stickRightDown = false;

        // L-104: 眨眼状态重置
        blinkState = 'open';
        eyeOpenValue = 1.0;
        blinkNextTime = performance.now() + BLINK_INTERVAL_MIN + Math.random() * (BLINK_INTERVAL_MAX - BLINK_INTERVAL_MIN);
        lastInteractionTime = performance.now();

        // 把已知参数归零
        var params = [
            'ParamAngleX', 'ParamAngleY', 'ParamAngleZ',
            'ParamEyeBallX', 'ParamEyeBallY',
            'ParamEyeLOpen', 'ParamEyeROpen',
            'ParamMouthOpenY', 'ParamMouthForm',
            'ParamBodyAngleX', 'ParamBodyAngleY', 'ParamBodyAngleZ',
            'ParamBreath',
            'ParamMouseX', 'ParamMouseY',
            'ParamMouseLeftDown', 'ParamMouseRightDown',
            'CatParamLeftHandDown', 'CatParamRightHandDown',
            'CatParamStickLX', 'CatParamStickLY',
            'CatParamStickRX', 'CatParamStickRY',
            'CatParamStickShowLeftHand', 'CatParamStickShowRightHand',
            'CatParamStickLeftDown', 'CatParamStickRightDown'
        ];
        // 逐键参数 (cdi3 自动发现) 一并归零, 防止换模型/复位后手停在某个键位
        for (var rpi = 0; rpi < modelKeyParamIds.length; rpi++) {
            params.push(modelKeyParamIds[rpi]);
        }
        for (var i = 0; i < params.length; i++) {
            try { model.internalModel.coreModel.setParameterValueById(params[i], 0); } catch (e) {}
        }
    }

    function setParameter(paramId, value) {
        var im = coreModel();
        if (!im) return false;
        try { im.setParameterValueById(paramId, value); return true; }
        catch (e) { return false; }
    }

    function playMotion(group, index) {
        if (!model) return false;
        try {
            if (group && model.motions && model.motions[group]) {
                model.motion(group, index || 0);
                return true;
            }
        } catch (e) { console.warn('playMotion err', e); }
        return false;
    }

    function playExpression(index) {
        if (!model) return false;
        try {
            if (model.expressions && model.expressions.length > index) {
                model.expression(index);
                return true;
            }
        } catch (e) { console.warn('playExpression err', e); }
        return false;
    }

    function getAvailableMotions() {
        if (!model || !model.motions) return {};
        var out = {};
        Object.keys(model.motions).forEach(function(k) { out[k] = model.motions[k].length; });
        return out;
    }
    function getAvailableExpressions() {
        return (model && model.expressions) ? model.expressions.length : 0;
    }
    // 注意: getParameterRange 已在文件前面定义 (带 min/max 校验)，此处不重复定义

    // === 按键按下/释放 (带 keyup 丢失兜底) ===
    function armKey(rawName) {
        var k = normalizeKey(rawName);
        var old = pressedKeyTimers[k];
        if (old) clearTimeout(old.timer);
        var rec = { raw: rawName, timer: null };
        rec.timer = setTimeout(function () {
            // 兜底: autoReleaseDelay 内没有收到 keyup (系统键/全屏独占切换等),
            // 强制视为释放, 避免手和键帽图永久卡住
            delete pressedKeyTimers[k];
            clearKeyImage(rawName);
            clearKeyImage(k);
        }, autoReleaseDelay);
        pressedKeyTimers[k] = rec;
    }
    function disarmKey(rawName) {
        var k = normalizeKey(rawName);
        var rec = pressedKeyTimers[k];
        if (rec) {
            clearTimeout(rec.timer);
            delete pressedKeyTimers[k];
        }
    }
    function releaseAllKeys() {
        Object.keys(pressedKeyTimers).forEach(function (k) {
            clearTimeout(pressedKeyTimers[k].timer);
            clearKeyImage(pressedKeyTimers[k].raw);
            clearKeyImage(k);
            delete pressedKeyTimers[k];
        });
    }
    function setAutoReleaseDelay(ms) {
        autoReleaseDelay = Math.max(0, ms | 0);
        console.log('autoReleaseDelay =', autoReleaseDelay, 'ms');
    }

    // =============================================
    // === L-103: 键盘驱动左右手 (BongoCat 官方命名规范) ===
    // 按键名 -> 图片路径 (由 C++ 通过 Live2DAPI._keyImages 注册)
    function handleKeyDown(keyName) {
        if (!keyName) return;
        armKey(keyName);

        // 显示对应按键图 (同时用原始名、规范化名和方向键别名查找)
        var k = normalizeKey(keyName);
        var paths = (window.Live2DAPI && window.Live2DAPI._keyImages) || {};
        var url = paths[keyName] || paths[k] || paths[arrowAlias(keyName)] || paths[arrowAlias(k)];
        // 模型自带逐键气泡时 (如星见雅骨架) 跳过 HTML 层, 避免双气泡重影
        if (url && !modelHasBuiltinKeyArt) setKeyImage(keyName, url);
    }
    function handleKeyUp(keyName) {
        if (!keyName) return;
        disarmKey(keyName);
        clearKeyImage(keyName);
        clearKeyImage(normalizeKey(keyName));
    }

    // 规范化键名 (BongoCat vs Web DOM Key naming compatibility)
    function normalizeKey(k) {
        var map = {
            'Num1': 'Digit1', 'Num2': 'Digit2', 'Num3': 'Digit3',
            'Num4': 'Digit4', 'Num5': 'Digit5', 'Num6': 'Digit6',
            'Num7': 'Digit7', 'Num8': 'Digit8', 'Num9': 'Digit9', 'Num0': 'Digit0',
            'Up': 'ArrowUp', 'Down': 'ArrowDown', 'Left': 'ArrowLeft', 'Right': 'ArrowRight',
            'Return': 'Enter',
            'ControlLeft': 'Control', 'ControlRight': 'Control',
            'ShiftLeft': 'Shift', 'ShiftRight': 'Shift',
            'AltLeft': 'Alt', 'AltRight': 'Alt',
            'MetaLeft': 'Meta', 'MetaRight': 'Meta'
        };
        return map[k] || k;
    }

    // 方向键资源文件名别名: C++ 注册的 BongoCat 模型文件名为 UpArrow/DownArrow/LeftArrow/RightArrow
    function arrowAlias(k) {
        var m = {
            'ArrowUp': 'UpArrow', 'Up': 'UpArrow',
            'ArrowDown': 'DownArrow', 'Down': 'DownArrow',
            'ArrowLeft': 'LeftArrow', 'Left': 'LeftArrow',
            'ArrowRight': 'RightArrow', 'Right': 'RightArrow'
        };
        return m[k] || null;
    }

    // =============================================
    // === L-101: 鼠标驱动眼球 / 头部 ===
    // C++ 传入的 nx, ny ∈ [-1, 1] (屏幕中心为 0, 右下角为 1),
    // 我们将其转到 [0, 1] 比例，再按各参数自身的 min/max 范围线性映射，
    // 公式: value = min + ratio * (max - min)，使参数值随鼠标方向正确变化
    function handleMouseMove(nx, ny) {
        if (!model) return;
        targetMouseXRatio = Math.max(0, Math.min(1, nx * 0.5 + 0.5));
        targetMouseYRatio = Math.max(0, Math.min(1, ny * 0.5 + 0.5));
        lastInteractionTime = performance.now();
    }

    // =============================================
    // === L-102: 鼠标左右键 ===
    // button: 0=左键, 2=右键 (DOM MouseEvent.button 约定)
    function handleMouseDown(button) {
        if (!model) return;
        lastInteractionTime = performance.now();
        // 手状态每帧由 mouseLeftDown/RightDown 与按键集合统一计算
        // (BongoCat 行为: 鼠标左键 → 左手, 右键 → 右手)
        if (button === 0) {
            mouseLeftDown = true;
        } else if (button === 2) {
            mouseRightDown = true;
        }
    }
    function handleMouseUp(button) {
        if (!model) return;
        if (button === 0) {
            mouseLeftDown = false;
        } else if (button === 2) {
            mouseRightDown = false;
        }
    }

    // =============================================
    // === L-104: 手柄输入接口 (从 C++ XInput 注入更准确) ===
    // leftX/leftY/rightX/rightY: [-1, 1]
    function handleGamepadAxis(leftX, leftY, rightX, rightY) {
        var dz = 0.15;
        stickLX = Math.abs(leftX) < dz ? 0 : leftX;
        stickLY = Math.abs(leftY) < dz ? 0 : leftY;
        stickRX = Math.abs(rightX) < dz ? 0 : rightX;
        stickRY = Math.abs(rightY) < dz ? 0 : rightY;
        stickShowLeft = stickLX !== 0 || stickLY !== 0 || stickLeftDown;
        stickShowRight = stickRX !== 0 || stickRY !== 0 || stickRightDown;
    }
    function handleGamepadButtonDown(button) {
        if (GAMEPAD_LEFT_BUTTONS.has(button)) { stickLeftDown = true; stickShowLeft = true; }
        if (GAMEPAD_RIGHT_BUTTONS.has(button)) { stickRightDown = true; stickShowRight = true; }
    }
    function handleGamepadButtonUp(button) {
        if (GAMEPAD_LEFT_BUTTONS.has(button)) { stickLeftDown = false; }
        if (GAMEPAD_RIGHT_BUTTONS.has(button)) { stickRightDown = false; }
        stickShowLeft = (stickLX !== 0 || stickLY !== 0 || stickLeftDown);
        stickShowRight = (stickRX !== 0 || stickRY !== 0 || stickRightDown);
    }

    // =============================================
    // === 背景图 & 按键图 (BongoCat 官方渲染层次) ===
    // =============================================
    const bgLayer = document.getElementById('bg-layer');
    const keyLayer = document.getElementById('key-layer');
    // keyName -> HTMLImageElement
    const pressedKeyImages = {};

    // 背景 sprite (画进 PIXI 画布) — 不用 HTML <img> 层:
    // Qt WebEngine 的窗口合成会把带透明像素的背景图 (非预乘 alpha, 如 (255,255,255,0))
    // 按预乘呈现为白色。因此把图片像素手动预乘 (RGB *= A/255), 透明像素变成 (0,0,0,0),
    // PIXI 按预乘 alpha 渲染即可正确透明。
    let bgSprite = null;

    function setBackground(url) {
        if (bgSprite) {
            try { app && app.stage.removeChild(bgSprite); bgSprite.destroy(); } catch (e) {}
            bgSprite = null;
        }
        bgLayer.style.display = 'none';
        bgLayer.removeAttribute('src');
        if (!url) return;

        var img = new Image();
        img.onload = function() {
            if (!app) return;
            var w = img.naturalWidth, h = img.naturalHeight;
            var cv = document.createElement('canvas');
            cv.width = w; cv.height = h;
            var ctx = cv.getContext('2d');
            ctx.drawImage(img, 0, 0);
            try {
                // 手动预乘 alpha: (R,G,B,A) -> (R*A/255, G*A/255, B*A/255, A)
                var imgData = ctx.getImageData(0, 0, w, h);
                var d = imgData.data;
                for (var i = 0; i < d.length; i += 4) {
                    var a = d[i + 3] / 255;
                    d[i] = Math.round(d[i] * a);
                    d[i + 1] = Math.round(d[i + 1] * a);
                    d[i + 2] = Math.round(d[i + 2] * a);
                }
                ctx.putImageData(imgData, 0, 0);
            } catch (e) {}
            var tex = PIXI.Texture.from(cv);
            bgSprite = new PIXI.Sprite(tex);
            scaleBackground();
            app.stage.addChildAt(bgSprite, 0);
        };
        img.onerror = function() { console.warn('[Live2D] background load failed:', url); };
        img.src = url;
    }

    function setKeyImage(keyName, url) {
        if (!keyName) return;
        var img = pressedKeyImages[keyName];
        if (!img) {
            img = document.createElement('img');
            img.alt = '';
            img.draggable = false;
            keyLayer.appendChild(img);
            pressedKeyImages[keyName] = img;
        }
        img.src = url;
        img.style.display = 'block';
    }

    function clearKeyImage(keyName) {
        var img = pressedKeyImages[keyName];
        if (img) {
            img.style.display = 'none';
            img.removeAttribute('src');
        }
    }

    function clearAllKeyImages() {
        Object.keys(pressedKeyImages).forEach(function(k) {
            clearKeyImage(k);
        });
    }

    // =============================================
    // === 主更新循环 (requestAnimationFrame) ===
    var updateLoopCount = 0;
    // L-?: 最大帧率限制 (0 = 不限); 由 C++ Live2DWidget::setMaxFps 下发
    var maxFps = 0;
    var lastFrameTs = 0;
    function updateLoop() {
        if (!model) {
            if (updateLoopCount < 3) { console.log('[updateLoop] waiting for model...'); updateLoopCount++; }
            requestAnimationFrame(updateLoop);
            return;
        }
        // 帧率节流: 未到帧间隔直接安排下一轮, 跳过本次模型更新与渲染
        if (maxFps > 0) {
            var nowTs = performance.now();
            if (nowTs - lastFrameTs < 1000 / maxFps) {
                requestAnimationFrame(updateLoop);
                return;
            }
            lastFrameTs = nowTs;
        }
        if (updateLoopCount === 0) {
            console.log('[updateLoop] start, mode=' + currentMode);
            updateLoopCount = 1;
            // 首次启动时初始化眨眼计时
            blinkNextTime = performance.now() + BLINK_INTERVAL_MIN + Math.random() * (BLINK_INTERVAL_MAX - BLINK_INTERVAL_MIN);
        }

        var now = performance.now();

        // === 每帧从按下中的键集合计算左右手状态与逐键参数 ===
        // (兜底定时器在 armKey 中管理, keyup 丢失到点会自动把键移出集合)
        //
        // 与官方 BongoCat (main/index.vue + useGamepad.ts) 完全一致的映射:
        //   CatParamLeftHandDown  = 左手键帽按下 || 左摇杆移动/按下
        //   CatParamRightHandDown = 右手键帽按下 || 右摇杆移动/按下
        //   ParamMouseLeftDown/RightDown 只由物理鼠标驱动, 绝不并入手参数
        // 实测 YuHen 骨架 (星见雅/菲比等) 上 LHD=1 且 MLD=1 会让手部形变叠加成
        // "抬手悬空/卡没"的怪姿态。模型缺少鼠标按下参数时才回退用手参数表达。
        // 键帽左右手归属以模型资源注册表 _keyHands 为准 (classifyKey)。
        var lhDown = false;
        var rhDown = false;
        // 同手键盘占用标记: 该手有键盘键激活时, 鼠标按压不再把手从键帽拉回鼠标
        // (真实场景: 左手按着 Alt, 右手握鼠标点击 —— 卡通模型里鼠标与键盘左半
        //  同由一只手负责, 两个输入源同时驱动会导致手在鼠标上、键帽气泡却亮着)
        var lhKeyActive = false, rhKeyActive = false;
        var activeKeyParams = {};
        for (var pk in pressedKeyTimers) {
            var pkHand = classifyKey(pk);
            if (pkHand === 'left') { lhDown = true; lhKeyActive = true; }
            else if (pkHand === 'right') { rhDown = true; rhKeyActive = true; }
            // 数据驱动映射: 规范键 -> 当前模型的逐键参数 Id (cdi3 自动发现)
            var mappedKeyParam = modelKeyToParam[pk];
            if (mappedKeyParam) activeKeyParams[mappedKeyParam] = true;
        }
        // 手柄: 摇杆偏移或同侧按键按下 (官方 stickActive.left/right)
        if (stickLX !== 0 || stickLY !== 0 || stickLeftDown) lhDown = true;
        if (stickRX !== 0 || stickRY !== 0 || stickRightDown) rhDown = true;
        // 老式模型无独立鼠标按下参数时的回退路径
        if (!modelHasMouseLParam && mouseLeftDown) lhDown = true;
        if (!modelHasMouseRParam && mouseRightDown) rhDown = true;
        leftHandDown = lhDown;
        rightHandDown = rhDown;

        // === L-101: 鼠标位置平滑插值 (damping, 帧率无关) ===
        // 参考 BongoCat useDevice.ts: alpha = 1 - 0.75^(deltaMS/(1000/60))
        var dt = 16.7;
        if (updateLoop.lastT) {
            dt = Math.max(8, Math.min(50, now - updateLoop.lastT));
        }
        updateLoop.lastT = now;
        var alpha = 1 - Math.pow(0.75, dt / (1000 / 60));
        currentMouseXRatio += (targetMouseXRatio - currentMouseXRatio) * alpha;
        currentMouseYRatio += (targetMouseYRatio - currentMouseYRatio) * alpha;
        // 内置逐键艺术模型 (星见雅骨架等): 其鼠标垫发光与左手位置由 ParamMouseX/Y
        // 驱动, 而该骨架的左手常驻鼠标球。键盘激活期间 (真实场景: 左手按住 Alt,
        // 右手握鼠标点击) 若光标恰在屏幕一侧, 就会出现"鼠标垫发光、手压球, 键帽
        // 气泡却亮着"的违和画面。故键盘占用期间把设备侧坐标平滑归中 (垫熄灭),
        // 头/眼仍由上面的 currentMouse*Ratio 独立跟随; 键松开后平滑恢复。
        var handArtTargetXRatio = currentMouseXRatio;
        var handArtTargetYRatio = currentMouseYRatio;
        if (modelHasBuiltinKeyArt && (lhKeyActive || rhKeyActive)) {
            handArtTargetXRatio = 0.5;
            handArtTargetYRatio = 0.5;
        }
        handArtXRatio += (handArtTargetXRatio - handArtXRatio) * alpha;
        handArtYRatio += (handArtTargetYRatio - handArtYRatio) * alpha;
        // 合并右摇杆到眼球位置 (手柄模式)
        var eyeRatioX = currentMouseXRatio + stickRX * 0.5;
        var eyeRatioY = currentMouseYRatio + stickRY * 0.5;

        // === L-101: 按参数 min/max 映射 ===
        // X/Y 轴: value = max - ratio * (max - min)  (与官方 BongoCat 一致)
        // Z 轴:    value = (1-2*xRatio) * (1-2*yRatio) * min
        function mapAxis(id, ratio) {
            var r = getParamRange(id);
            if (!r) return null;
            // 与官方 BongoCat useModel.ts 一致: value = max - ratio * (max - min)
            // (此前 min + ratio*(max-min) 是镜像方向，眼睛/头部会朝反方向转动)
            return r.max - ratio * (r.max - r.min);
        }
        function mapZAxis(id, xRatio, yRatio) {
            var r = getParamRange(id);
            if (!r) return null;
            var dragX = 1 - 2 * xRatio;
            var dragY = 1 - 2 * yRatio;
            return dragX * dragY * r.min;
        }

        // ParamMouseX/Y 在内置逐键艺术模型上同时驱动鼠标垫发光/左手设备位置,
        // 键盘激活时使用归中后的 handArt*Ratio; 其它模型沿用真实鼠标坐标
        var mouseRatioForArt = modelHasBuiltinKeyArt;
        var vMouseX  = mapAxis('ParamMouseX', mouseRatioForArt ? handArtXRatio : currentMouseXRatio);
        var vMouseY  = mapAxis('ParamMouseY', mouseRatioForArt ? handArtYRatio : currentMouseYRatio);
        var vAngleX  = mapAxis('ParamAngleX', currentMouseXRatio);
        var vAngleY  = mapAxis('ParamAngleY', currentMouseYRatio);
        var vAngleZ  = mapZAxis('ParamAngleZ', currentMouseXRatio, currentMouseYRatio);
        var vEyeBallX= mapAxis('ParamEyeBallX', eyeRatioX);
        var vEyeBallY= mapAxis('ParamEyeBallY', eyeRatioY);

        // 手柄左摇杆叠加到头部角度 (gamepad 模式)
        if (vAngleX !== null) vAngleX += stickLX * 30;
        if (vAngleY !== null) vAngleY -= stickLY * 30;
        if (vAngleZ !== null) vAngleZ += stickLX * 10;

        // === L-104: 待机动画 - 自然呼吸/摆动 (无交互时叠加正弦微动) ===
        var idleTime = (now - lastInteractionTime) / 1000;
        var idleAmount = Math.max(0, Math.min(1, (idleTime - 0.5) / 2.0)); // 0.5s 后开始，2.5s 达到最大
        var breath = Math.sin(now / 1800) * 0.5 + 0.5;        // 0~1
        var bodySway = Math.sin(now / 3200) * 3.0;             // ±3 度
        var headBob = Math.sin(now / 2100) * 1.2;              // ±1.2 度
        // ParamBreath 官方范围通常是 0~1
        var breathValue = breath;

        if (vAngleX !== null) vAngleX += bodySway * idleAmount * 0.5;
        if (vAngleY !== null) vAngleY += headBob * idleAmount * 0.5;
        // 身体角度跟随头部轻微转动
        var bodyRange = getParamRange('ParamBodyAngleX');
        var vBodyAngleX = (vAngleX !== null && bodyRange) ? vAngleX * 0.3 : null;

        // === L-104: 自动眨眼状态机 ===
        // 禁用 pixi-live2d-display 内置眨眼，由我们手动控制，更可靠
        if (model.internalModel && model.internalModel.eyeBlink) {
            try {
                if (typeof model.internalModel.eyeBlink.setEyeBlink === 'function') {
                    // no-op; pixi-live2d-display 没有标准 disable API，通过每帧覆盖参数即可
                }
            } catch (e) {}
        }
        updateBlink(now);
        // 鼠标按下时不闭眼，避免视觉冲突 (但眨眼依然按计划进行)

        // === 应用所有参数 ===
        // 眼球 / 头部
        // mapAxis 已按参数自身 [min, max] 映射，且 Cubism 内部 setParameter 会再次
        // 钳制到 [min, max]，因此无需额外硬编码 clamp，避免限制模型原生范围
        if (vMouseX !== null)  safeSetParam('ParamMouseX', vMouseX);
        if (vMouseY !== null)  safeSetParam('ParamMouseY', vMouseY);
        if (vAngleX !== null)  safeSetParam('ParamAngleX', vAngleX);
        if (vAngleY !== null)  safeSetParam('ParamAngleY', vAngleY);
        if (vAngleZ !== null)  safeSetParam('ParamAngleZ', vAngleZ);
        if (vEyeBallX !== null) safeSetParam('ParamEyeBallX', vEyeBallX);
        if (vEyeBallY !== null) safeSetParam('ParamEyeBallY', vEyeBallY);
        if (vBodyAngleX !== null) safeSetParam('ParamBodyAngleX', vBodyAngleX);

        // 呼吸
        safeSetParam('ParamBreath', breathValue);

        // 眼睛开闭 (自动眨眼)
        if (hasParam('ParamEyeLOpen')) safeSetParam('ParamEyeLOpen', eyeOpenValue);
        if (hasParam('ParamEyeROpen')) safeSetParam('ParamEyeROpen', eyeOpenValue);

        // L-102/L-103: 手部/鼠标按下状态 (官方参数名)
        // 使用参数真实范围设置值，兼容不同模型的参数范围差异
        var lhRange = getParamRange('CatParamLeftHandDown');
        var rhRange = getParamRange('CatParamRightHandDown');
        var mlRange = getParamRange('ParamMouseLeftDown');
        var mrRange = getParamRange('ParamMouseRightDown');
        safeSetParam('CatParamLeftHandDown', leftHandDown ? (lhRange ? lhRange.max : 1) : (lhRange ? lhRange.min : 0));
        safeSetParam('CatParamRightHandDown', rightHandDown ? (rhRange ? rhRange.max : 1) : (rhRange ? rhRange.min : 0));
        // 键盘占用同只手时屏蔽鼠标按压: 手留在键帽上而不是被拉回鼠标球
        var effMouseL = mouseLeftDown && !lhKeyActive;
        var effMouseR = mouseRightDown && !rhKeyActive;
        safeSetParam('ParamMouseLeftDown', effMouseL ? (mlRange ? mlRange.max : 1) : (mlRange ? mlRange.min : 0));
        safeSetParam('ParamMouseRightDown', effMouseR ? (mrRange ? mrRange.max : 1) : (mrRange ? mrRange.min : 0));

        // 逐键参数 (cdi3 自动发现的模型参数): 激活键位=max, 其余=min。
        // 官方模型没有这类参数时 modelKeyParamIds 为空, 整段零开销跳过。
        for (var kpi = 0; kpi < modelKeyParamIds.length; kpi++) {
            var hpId = modelKeyParamIds[kpi];
            if (!hasParam(hpId)) continue;
            var hpRange = getParamRange(hpId);
            safeSetParam(hpId, activeKeyParams[hpId]
                ? (hpRange ? hpRange.max : 1)
                : (hpRange ? hpRange.min : 0));
        }

        // L-104: 手柄专有参数 (gamepad 模式)
        safeSetParam('CatParamStickLX', stickLX);
        safeSetParam('CatParamStickLY', stickLY);
        safeSetParam('CatParamStickRX', stickRX);
        safeSetParam('CatParamStickRY', stickRY);
        var slhRange = getParamRange('CatParamStickShowLeftHand');
        var srhRange = getParamRange('CatParamStickShowRightHand');
        var sldRange = getParamRange('CatParamStickLeftDown');
        var srdRange = getParamRange('CatParamStickRightDown');
        safeSetParam('CatParamStickShowLeftHand', stickShowLeft ? (slhRange ? slhRange.max : 1) : (slhRange ? slhRange.min : 0));
        safeSetParam('CatParamStickShowRightHand', stickShowRight ? (srhRange ? srhRange.max : 1) : (srhRange ? srhRange.min : 0));
        safeSetParam('CatParamStickLeftDown', stickLeftDown ? (sldRange ? sldRange.max : 1) : (sldRange ? sldRange.min : 0));
        safeSetParam('CatParamStickRightDown', stickRightDown ? (srdRange ? srdRange.max : 1) : (srdRange ? srdRange.min : 0));

        requestAnimationFrame(updateLoop);
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // === L-104: 自动眨眼状态机 ===
    // 阶段: open(等待) -> closing(80ms) -> closed(60ms) -> opening(120ms) -> open
    function updateBlink(now) {
        switch (blinkState) {
            case 'open':
                eyeOpenValue = 1.0;
                if (now >= blinkNextTime) {
                    blinkState = 'closing';
                    blinkStateTime = now;
                }
                break;
            case 'closing':
                var ct = (now - blinkStateTime) / 80;
                if (ct >= 1) {
                    eyeOpenValue = 0.0;
                    blinkState = 'closed';
                    blinkStateTime = now;
                } else {
                    // ease-in
                    eyeOpenValue = 1.0 - ct * ct;
                }
                break;
            case 'closed':
                eyeOpenValue = 0.0;
                if (now - blinkStateTime >= 60) {
                    blinkState = 'opening';
                    blinkStateTime = now;
                }
                break;
            case 'opening':
                var ot = (now - blinkStateTime) / 120;
                if (ot >= 1) {
                    eyeOpenValue = 1.0;
                    blinkState = 'open';
                    blinkNextTime = now + BLINK_INTERVAL_MIN + Math.random() * (BLINK_INTERVAL_MAX - BLINK_INTERVAL_MIN);
                } else {
                    // ease-out
                    eyeOpenValue = ot * (2 - ot);
                }
                break;
        }
    }

    // =============================================
    // === C++/JS 桥接: 使用 document.title 作为 JS -> C++ 事件通道
    // Qt WebView (WebView2 后端) 不支持 QWebChannel 的 webChannelTransport,
    // 因此通过设置 document.title 触发 QML WebView 的 titleChanged 信号,
    // C++ 端在槽函数中解析 title 内容。消息格式为 JSON:
    //   { "event": "ready" | "modelLoaded" | "error", ... }
    // 为避免与页面真实 title 冲突, 统一使用 "__bongocat__:" 前缀。
    // C++ -> JS 方向直接通过 runJavaScript 调用 window.Live2DAPI.* 即可。
    function notifyCpp(eventName, payload) {
        try {
            var msg = { event: eventName };
            if (payload !== undefined) msg.data = payload;
            // 每次赋值都会触发 titleChanged, 即便值相同也强制更新
            document.title = '__bongocat__:' + JSON.stringify(msg) + ':' + Date.now();
        } catch (e) {
            console.warn('notifyCpp failed:', e);
        }
    }

    function notifyBackendReady() {
        isInitialized = true;
        console.log('[Bridge] notifying C++: ready');
        notifyCpp('ready');
    }

    function notifyModelLoaded(modelInfo) {
        notifyCpp('modelLoaded', modelInfo);
    }

    function notifyError(errMsg) {
        notifyCpp('error', { message: errMsg });
    }

    function startBridge() {
        // Live2DAPI 在脚本末尾定义, 这里稍微等待一下确保对象已挂载
        var tries = 0;
        var t = setInterval(function() {
            tries++;
            if (window.Live2DAPI && typeof window.Live2DAPI.loadModel === 'function') {
                clearInterval(t);
                notifyBackendReady();
            } else if (tries > 200) {
                clearInterval(t);
                console.error('[Bridge] Live2DAPI not ready after 10s');
            }
        }, 50);
    }

    // =============================================
    // === 启动更新循环 ===
    requestAnimationFrame(updateLoop);

    // =============================================
    // === 暴露给 C++ 的全局 API ===
    window.Live2DAPI = {
        // 按键图注册表: { "KeyA": "file:///.../KeyA.png", ... }
        // C++ 通过 setKeyImage(keyName, path) 注册，按下时自动显示
        _keyImages: {},
        // 按键手别注册表: { "KeyA": "left", "KeyL": "right", ... }
        // C++ 按模型 resources/left-keys|right-keys 目录注册 (与官方 BongoCat 一致),
        // 是左右手归属的权威数据源; 查不到的键回退物理键位分区
        _keyHands: {},

        loadModel: loadModel,
        // C++ 加载模型时下发该模型 cdi3.json 的参数元数据:
        // [{id, name, min, max, dflt}, ...]; 模型加载完成后据此自动建立键映射。
        // 传空数组表示模型无 cdi3, 回退历史命名兜底表。
        setModelParamMeta: function (list) {
            modelParamMeta = Array.isArray(list) ? list : [];
            if (model) rebuildKeyParamMap();
        },
        setParameter: setParameter,
        playMotion: playMotion,
        playExpression: playExpression,
        handleKeyDown: handleKeyDown,
        handleKeyUp: handleKeyUp,
        handleMouseMove: handleMouseMove,
        handleMouseDown: handleMouseDown,
        handleMouseUp: handleMouseUp,
        handleGamepadAxis: handleGamepadAxis,
        handleGamepadButtonDown: handleGamepadButtonDown,
        handleGamepadButtonUp: handleGamepadButtonUp,
        resetParameters: resetParameters,
        setAutoReleaseDelay: setAutoReleaseDelay,
        setMaxFps: function (fps) {
            maxFps = (fps && fps > 0) ? fps : 0;
            lastFrameTs = 0;
        },
        setBackground: setBackground,
        setKeyImage: function(keyName, url, hand) {
            // 兼容旧 API: 立即显示按键图 (不推荐); hand='left'|'right' 注册手别
            if (url) {
                this._keyImages[keyName] = url; setKeyImage(keyName, url);
                if (hand === 'left' || hand === 'right') this._keyHands[keyName] = hand;
            } else {
                delete this._keyImages[keyName]; delete this._keyHands[keyName];
                clearKeyImage(keyName);
            }
        },
        clearKeyImage: clearKeyImage,
        clearAllKeyImages: function() {
            this._keyImages = {};
            this._keyHands = {};
            clearAllKeyImages();
        },
        getParameterRange: getParameterRange,
        getAvailableMotions: getAvailableMotions,
        getAvailableExpressions: getAvailableExpressions,
        getMode: function() { return currentMode; },
        destroy: function() {
            if (model) { try { model.destroy(); } catch(e){} model = null; }
            if (app) { try { app.destroy(true); } catch(e){} app = null; }
        }
    };

    console.log('[BongoCat Live2D] window.Live2DAPI ready (waiting for pixi & core)');
    </script>
</body>
</html>
