<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BongoCat Live2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { background: transparent; }
        #app { width: 100%; height: 100%; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/pixi-live2d-display.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <div id="app"></div>
    <script>
    // === Live2D 渲染引擎 ===
    let app = null;
    let model = null;
    let currentModelPath = null;
    let isInitialized = false;

    // === Pixi.js 初始化 ===
    function initPixi() {
        if (app) return app;

        app = new PIXI.Application({
            view: document.getElementById('app'),
            transparent: true,
            backgroundAlpha: 0,
            resizeTo: window,
            autoStart: true,
            powerPreference: 'high-performance',
            resolution: window.devicePixelRatio || 1,
            antialias: true
        });

        window.addEventListener('resize', () => {
            if (model) {
                scaleModel();
            }
        });

        return app;
    }

    // === 加载Live2D模型 ===
    async function loadModel(modelPath) {
        try {
            initPixi();

            if (model) {
                model.destroy();
                model = null;
            }

            // 转换文件路径 (Windows路径需要特殊处理)
            const assetPath = modelPath.replace(/\\/g, '/');
            const modelJsonPath = assetPath.endsWith('.model3.json')
                ? assetPath
                : assetPath + '/cat.model3.json';

            console.log('Loading model from:', modelJsonPath);

            model = await PIXI.live2d.Live2DModel.from(modelJsonPath, {
                autoInteract: false,
                autoUpdate: true
            });

            // 设置模型位置
            scaleModel();
            app.stage.addChild(model);

            // 初始化参数
            resetParameters();

            // 通知C++端模型加载完成
            if (typeof qt !== 'undefined' && qt.live2d) {
                const modelInfo = {
                    width: model.width,
                    height: model.height,
                    motions: getAvailableMotions(),
                    expressions: getAvailableExpressions()
                };
                qt.live2d.onModelLoaded(JSON.stringify(modelInfo));
            }

            console.log('Model loaded successfully');
            return true;
        } catch (error) {
            console.error('Failed to load model:', error);
            if (typeof qt !== 'undefined' && qt.live2d) {
                qt.live2d.onError(error.message);
            }
            return false;
        }
    }

    // === 缩放模型适配窗口 ===
    function scaleModel() {
        if (!model || !app) return;

        const screenWidth = app.screen.width;
        const screenHeight = app.screen.height;

        // 计算缩放比例 (保持模型比例)
        const scaleX = screenWidth / model.width;
        const scaleY = screenHeight / model.height;
        const scale = Math.min(scaleX, scaleY) * 0.9; // 留一点边距

        model.scale.set(scale);

        // 居中
        model.x = (screenWidth - model.width * scale) / 2;
        model.y = (screenHeight - model.height * scale) / 2;
    }

    // === 重置参数 ===
    function resetParameters() {
        if (!model) return;

        const params = ['ParamAngleX', 'ParamAngleY', 'ParamAngleZ',
                        'ParamEyeBallX', 'ParamEyeBallY',
                        'ParamMouthOpenY', 'ParamMouthForm',
                        'ParamBodyAngleX'];

        params.forEach(param => {
            try {
                model.setParameterValueById(param, 0);
            } catch (e) {
                // 忽略不存在的参数
            }
        });
    }

    // === 设置参数值 ===
    function setParameter(paramId, value) {
        if (!model) return false;
        try {
            model.setParameterValueById(paramId, value);
            return true;
        } catch (e) {
            return false;
        }
    }

    // === 获取参数范围 ===
    function getParameterRange(paramId) {
        if (!model) return null;
        try {
            const param = model.internalModel.coreModel.getParameterIndex(paramId);
            if (param < 0) return null;

            const coreModel = model.internalModel.coreModel;
            return {
                min: coreModel.getParameterMinimumValue(param),
                max: coreModel.getParameterMaximumValue(param),
                def: coreModel.getParameterDefaultValue(param)
            };
        } catch (e) {
            return null;
        }
    }

    // === 播放动作 ===
    function playMotion(group, index) {
        if (!model) return false;
        try {
            if (group && model.motions && model.motions[group]) {
                model.motion(group, index);
                return true;
            }
        } catch (e) {
            console.warn('Failed to play motion:', e);
        }
        return false;
    }

    // === 播放表情 ===
    function playExpression(index) {
        if (!model) return false;
        try {
            if (model.expressions && model.expressions.length > index) {
                model.expression(index);
                return true;
            }
        } catch (e) {
            console.warn('Failed to play expression:', e);
        }
        return false;
    }

    // === 获取可用动作列表 ===
    function getAvailableMotions() {
        if (!model || !model.motions) return {};
        const motions = {};
        Object.keys(model.motions).forEach(key => {
            motions[key] = model.motions[key].length;
        });
        return motions;
    }

    // === 获取可用表情数量 ===
    function getAvailableExpressions() {
        if (!model || !model.expressions) return 0;
        return model.expressions.length;
    }

    // === 键盘/鼠标输入处理 ===
    // 左手按键 -> 左眼参数
    const LEFT_KEYS = ['KeyA', 'KeyB', 'KeyC', 'KeyD', 'KeyE', 'KeyF', 'KeyG',
                       'KeyQ', 'KeyR', 'KeyS', 'KeyT', 'KeyV', 'KeyW', 'KeyX', 'KeyZ',
                       'Num1', 'Num2', 'Num3', 'Space', 'Shift', 'Control'];

    // 右手按键 -> 右眼参数
    const RIGHT_KEYS = ['KeyH', 'KeyI', 'KeyJ', 'KeyK', 'KeyL', 'KeyM', 'KeyN',
                        'KeyO', 'KeyP', 'KeyU', 'KeyY',
                        'Num4', 'Num5', 'Num6', 'Num7', 'Num8', 'Num9', 'Num0',
                        'Return', 'Alt', 'Tab'];

    // 更新手部状态
    function updateHandState(isLeft, isDown) {
        if (!model) return;
        try {
            // BongoCat使用ParamHandLeft/ParamHandRight参数
            // 0=默认, 1=按键按下
            const paramId = isLeft ? 'ParamHandLeft' : 'ParamHandRight';
            model.setParameterValueById(paramId, isDown ? 1 : 0);
        } catch (e) {
            // 备选方案：使用其他参数
            // 有些模型使用 ParamBodyAngleX 等参数
        }
    }

    // 处理按键按下
    function handleKeyDown(keyName) {
        if (LEFT_KEYS.includes(keyName)) {
            updateHandState(true, true);
        }
        if (RIGHT_KEYS.includes(keyName)) {
            updateHandState(false, true);
        }

        // 播放按键音效/动作
        if (keyName === 'Space') {
            playMotion('TapBody', 0);
        }
    }

    // 处理按键释放
    function handleKeyUp(keyName) {
        if (LEFT_KEYS.includes(keyName)) {
            updateHandState(true, false);
        }
        if (RIGHT_KEYS.includes(keyName)) {
            updateHandState(false, false);
        }
    }

    // 处理鼠标移动 (眼睛跟随)
    function handleMouseMove(x, y) {
        if (!model) return;

        // 将鼠标坐标归一化到 [-1, 1]
        const nx = (x / window.innerWidth) * 2 - 1;
        const ny = (y / window.innerHeight) * 2 - 1;

        try {
            model.setParameterValueById('ParamAngleX', nx * 30);
            model.setParameterValueById('ParamAngleY', ny * 30);
            model.setParameterValueById('ParamEyeBallX', nx);
            model.setParameterValueById('ParamEyeBallY', ny);
        } catch (e) {
            // 忽略参数不存在的错误
        }
    }

    // 处理鼠标按下
    function handleMouseDown(button) {
        if (!model) return;
        try {
            if (button === 0) { // 左键
                model.setParameterValueById('ParamHandLeft', 1);
            } else if (button === 2) { // 右键
                model.setParameterValueById('ParamHandRight', 1);
            }
            // 播放点击动作
            playMotion('TapBody', 0);
        } catch (e) {
            // 忽略错误
        }
    }

    // 处理鼠标释放
    function handleMouseUp(button) {
        if (!model) return;
        try {
            if (button === 0) {
                model.setParameterValueById('ParamHandLeft', 0);
            } else if (button === 2) {
                model.setParameterValueById('ParamHandRight', 0);
            }
        } catch (e) {
            // 忽略错误
        }
    }

    // === Qt WebChannel 通信 ===
    let qt = null;

    new QWebChannel(qt.webChannelTransport, function (channel) {
        qt = channel.objects.qt;
        isInitialized = true;

        // 通知C++端JavaScript已准备就绪
        if (qt && qt.live2d) {
            qt.live2d.onReady();
        }
    });

    // === 暴露给C++的全局接口 ===
    window.Live2DAPI = {
        loadModel: loadModel,
        setParameter: setParameter,
        playMotion: playMotion,
        playExpression: playExpression,
        handleKeyDown: handleKeyDown,
        handleKeyUp: handleKeyUp,
        handleMouseMove: handleMouseMove,
        handleMouseDown: handleMouseDown,
        handleMouseUp: handleMouseUp,
        resetParameters: resetParameters,
        getParameterRange: getParameterRange,
        getAvailableMotions: getAvailableMotions,
        getAvailableExpressions: getAvailableExpressions,
        destroy: function() {
            if (model) {
                model.destroy();
                model = null;
            }
            if (app) {
                app.destroy(true);
                app = null;
            }
        }
    };

    console.log('Live2D engine initialized');
    </script>
</body>
</html>
